name: Deploy 후기돋보기 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download published site files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify and build reviewed content
        run: |
          npm ci
          npm run check
          npm run build
          npm run test:ui
          npm run test:data
          npm run verify:release

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload published site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
